spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true

jwt:
  secret: ${JWT_SECRET:}
  secret-file: ${JWT_SECRET_FILE:}
  expiration: ${JWT_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

storage:
  local-root: uploads

app:
  bootstrap-demo-data: ${APP_BOOTSTRAP_DEMO_DATA:false}
  demo:
    mode: ${DEMO_MODE:false}
    data-enabled: ${DEMO_DATA_ENABLED:false}
  auth:
    allow-self-registration: ${APP_AUTH_ALLOW_SELF_REGISTRATION:false}
    allow-admin-bootstrap: ${APP_AUTH_ALLOW_ADMIN_BOOTSTRAP:false}
    bootstrap-admin:
      email: ${APP_AUTH_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${APP_AUTH_BOOTSTRAP_ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  realtime:
    sla-monitor-delay-ms: ${APP_REALTIME_SLA_MONITOR_DELAY_MS:60000}
    sla-monitor-initial-delay-ms: ${APP_REALTIME_SLA_MONITOR_INITIAL_DELAY_MS:15000}
  metrics:
    refresh-delay-ms: ${APP_METRICS_REFRESH_DELAY_MS:30000}
    refresh-initial-delay-ms: ${APP_METRICS_REFRESH_INITIAL_DELAY_MS:10000}
  timesheets:
    zone-id: ${APP_TIMESHEETS_ZONE_ID:America/New_York}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  
  health:
    diskspace:
      enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: a3-fsm-backend
info:
  app:
    name: A3 Field Service Management Platform
    description: Real-time field service management system
    version: 1.0.0
