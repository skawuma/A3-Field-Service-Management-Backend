spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:a3fsm_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

server:
  port: 0

jwt:
  secret: test-secret-key-with-at-least-thirty-two-bytes
  expiration: 3600000
  refresh-expiration: 604800000

storage:
  local-root: target/test-uploads

app:
  bootstrap-demo-data: false
  cors:
    allowed-origins: http://localhost:4200
  realtime:
    sla-monitor-delay-ms: 60000
    sla-monitor-initial-delay-ms: 15000

management:
  endpoints:
    web:
      exposure:
        include: health,info
